name: Build AndroidIDE

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Direct APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ১. সম্পূর্ণ Git Tags ও হিস্ট্রি ক্লোন করার নির্দেশ (যাতে SemVer এরর না আসে)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Create Missing Directories
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies

      # ২. নিরাপদভাবে ভ্যালিড ভার্সন সহ বিল্ড রান করা
      - name: Build Debug APK
        run: ./gradlew :core:app:assembleDebug -PversionName=v2.7.0-beta -PversionCode=2700 --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          find core/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      # ৩. সরাসরি আসল রঅ APK রিলিজ করা
      - name: Release Direct APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.7.0-${{ github.run_number }}"
          name: "Android AI Studio v2.7.0"
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
